name: Playwright Enterprise Tests

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: QA
        type: choice
        options:
          - QA
          - UAT
          - PROD

      testFile:
        description: Playwright Test File
        required: true
        default: tests/ui/alltest.spec.js

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    env:
      ENV: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execution Details
        run: |
          echo "===================================="
          echo "Environment : $ENV"
          echo "Browser     : ${{ matrix.browser }}"
          echo "Test File   : ${{ github.event.inputs.testFile }}"
          echo "===================================="

      - name: Execute Tests
        run: |
          npx playwright test "${{ github.event.inputs.testFile }}" --project=${{ matrix.browser }}
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npx allure-commandline generate allure-results --clean -o allure-report

      # Prepare GitHub Pages only once (Chromium)
      - name: Prepare GitHub Pages
        if: always() && matrix.browser == 'chromium'
        run: |
          mkdir -p github-pages

          cp reports/index.html github-pages/index.html

          mkdir -p github-pages/allure
          cp -r allure-report/* github-pages/allure/ || true

          mkdir -p github-pages/playwright
          cp -r playwright-report/* github-pages/playwright/ || true

      # Upload Pages artifact only once
      - name: Upload Pages Artifact
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      # Upload reports for every browser
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy Reports
    needs: test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4